html_code = """<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C# Qeustionbox (No AI)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background-color: #f4f4f9;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #0056b3;
    }
    #antwoord {
      margin-top: 15px;
      padding: 10px;
      background-color: #eef;
      border-radius: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Stel je vraag aan Tommy de ML</h2>
    <textarea id="vraag" placeholder="Wat is je vraag?"></textarea>
    <button onclick="stelVraag()">Stuur vraag</button>
    
    <div id="antwoord">Het antwoord verschijnt hier...</div>
  </div>

  <script>
    // VUL HIER JE NIEUWE GEMINI API KEY IN (Begint meestal met AIzaSy...)
    const API_KEY = "AQ.Ab8RN6LBbJ2dOtUi8JFSZaMK3y_fY2enxLccf5RPan29n_Jssg";

    async function stelVraag() {
      const vraagText = document.getElementById("vraag").value;
      const antwoordDiv = document.getElementById("antwoord");

      if (!vraagText) {
        antwoordDiv.innerText = "Typ eerst een vraag in.";
        return;
      }

      antwoordDiv.innerText = "Ik kom zo bij terug!";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-pro-preview:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: vraagText }]
            }]
          })
        });

        const data = await response.json();
        
        // Controleer of de API een foutmelding stuurde
        if (data.error) {
          antwoordDiv.innerText = "API Fout (" + data.error.code + "): " + data.error.message;
        } else if (data.candidates && data.candidates[0].content.parts[0].text) {
          antwoordDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
          antwoordDiv.innerText = "Onverwachte respons van de server.";
        }
      } catch (error) {
        antwoordDiv.innerText = "Fout bij verbinding maken: " + error.message;
      }
    }
  </script>

</body>
</html>
"""

with open("index.html", "w", encoding="utf-8") as f:
    f.write(html_code)
